[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pep-compass"
version = "0.0.1"
description = "Repository to develop experiments with riemannian geometry applied to variational autoencoders."
authors = [
  { name = "Jurand Prądzyński", email = "j.pradzynski@student.uw.edu.pl" }
]
readme = "README.md"
requires-python = ">=3.11,<4"

dependencies = [
  "numpy~=1.26.4",
  "setuptools~=69.5.1",
  "fire~=0.6.0",
  "scipy~=1.14.0",
  "pandas~=2.2.2",
  "rapidfuzz~=3.10.0",
  "matplotlib~=3.9.2",
  "levenshtein~=0.26.0",
  "peptides~=0.3.4",
  "Bio~=1.7.1",
  "einops~=0.8.0",
  "blosum~=2.0.3",
  "logomaker~=0.8.2",
  "umap-learn~=0.5.7",
  "wandb",
  "pyarrow",
  "seaborn~=0.13.2",
  "sqlalchemy~=2.0.20",
  "streamlit",
  "poli-core",
  "PyGSP~=0.5.1",
  "line_profiler",
  "mapchiral",
  "mhfp",
  "cachetools~=6.1.0",
  "pybktree~=1.1",
  "scikit_posthocs~=0.11.4",
  "scikit-learn>=1.7",
  "loguru>=0.7.3",
  "ipykernel>=7.2.0",
  "typer>=0.27.0",
  "PyYAML>=6.0.2",
]

[project.scripts]
pep-compass = "pep_compass.runtime.cli:main"

[project.optional-dependencies]
cpu = [
  "torch==2.10.0",
  "botorch",
  "poli-baselines @ git+https://github.com/MachineLearningLifeScience/poli-baselines.git@main",
  "seqme[aa-descriptors]>=0.5.0",
  "fair-esm>=2.0.0",
]
cu118 = [
  "torch==2.5.1",
  "botorch",
  "poli-baselines @ git+https://github.com/MachineLearningLifeScience/poli-baselines.git@main",
  "seqme[aa-descriptors]>=0.5.0",
  "fair-esm>=2.0.0",
]
cu126 = [
  "torch==2.10.0",
  "botorch",
  "poli-baselines @ git+https://github.com/MachineLearningLifeScience/poli-baselines.git@main",
  "seqme[aa-descriptors]>=0.5.0",
  "fair-esm>=2.0.0",
]
cu128 = [
  "torch==2.10.0",
  "botorch",
  "poli-baselines @ git+https://github.com/MachineLearningLifeScience/poli-baselines.git@main",
  "seqme[aa-descriptors]>=0.5.0",
  "fair-esm>=2.0.0",
]

[dependency-groups]
dev = [
  "pytest",
]

[tool.uv]
exclude-newer = "1 week"
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu118" },
  ],
  [
    { extra = "cpu" },
    { extra = "cu126" },
  ],
  [
    { extra = "cpu" },
    { extra = "cu128" },
  ],
  [
    { extra = "cu118" },
    { extra = "cu126" },
  ],
  [
    { extra = "cu118" },
    { extra = "cu128" },
  ],
  [
    { extra = "cu126" },
    { extra = "cu128" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu118", extra = "cu118" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"pep_compass.autoencoder.strategies.hydramp" = ["models/**/*.pickle"]
"pep_compass.optimization.components.helpers.substitution_matrices" = ["matrices/*.txt"]
"pep_compass.optimization.components.oracles.strategies.battleamp" = ["model.h5"]
"pep_compass.optimization.components.oracles.strategies.eipred" = ["DATA/**/*.pkl", "DATA/*.csv"]
"pep_compass.optimization.components.oracles.strategies.mbc_attention" = ["model/**/*.pb", "model/variables/*"]
"pep_compass.optimization.components.oracles.strategies.toxipep" = ["models/best_model_0.9.pth"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = [
  "integration: tests requiring external executables or services",
]
