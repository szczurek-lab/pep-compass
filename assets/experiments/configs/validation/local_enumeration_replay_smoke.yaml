# Fast persisted smoke run for checkpoint/replay reader validation.
experiment:
  name: local_enumeration_replay_smoke
  seed: 701
  input:
    sequences: [FLYKWWIRIGRLKL]
  output_directory: experiments/results/validation/local_enumeration_replay

autoencoder:
  method: hydramp
  model: article_25
  device: cpu
  parameters:
    jacobian_mode: approx
    jacobian_eps: 0.001
    field_eps: 0.001

tracking:
  # normal writes every SORBES z_i immediately to compact shards.
  level: normal
  candidate_snapshots: none
  store_latents: false
  store_fields: false
  monitor_stability: true

execution:
  backend: local
  max_workers: 1

pipeline:
  limits:
    oracle_calls: null
    generated_candidates: 16
  steps:
  - local_enumeration:
      trajectories: 1
      trajectory_execution: batched
      iterations: 1
      include_walk_points: false
      walker:
        method: sorbes
        parameters:
          horizontal_threshold: 0.001
          time_step: 0.01
          max_horizontal_update_norm: 0.1
          vertical_movement: false
      mutation_generator:
        method: mutang
        parameters:
          max_len: 25
          direction_significance_threshold: 0.001
          min_number_of_directions: 5
          token_threshold: 0.1
          maximum_candidates: 2
      filters:
      - method: deduplicate
        parameters:
          key: sequence_and_latent
